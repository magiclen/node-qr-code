[package]
name = "magic-qr-code"
version = "4.0.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/node-qr-code"
homepage = "https://magiclen.org/node-qrcode/"
keywords = ["nodejs", "QR", "generator", "micro-qr", "rmqr"]
categories = []
description = "Encode QR Code, Micro QR Code and rMQR symbols, and render them as SVG images, by using N-API."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
napi = "3.14.0"
napi-derive = "3.6.10"

[dependencies.qrcode-generator]
version = "6.1.1"
default-features = false
features = ["qr", "micro-qr", "rmqr"]

[build-dependencies]
napi-build = "2.6.0"
